name: Build-Check

# Reine Kompilier-Prüfung. Releases werden bewusst NICHT hier gebaut oder signiert -
# der private Signaturschlüssel bleibt lokal (siehe tools/release.sh und README).
# Minimale Rechte, Actions auf Commit-SHAs festgenagelt (kein "mutable tag"-Risiko).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x ./gradlew
      - run: ./gradlew :app:assembleRelease --no-daemon
